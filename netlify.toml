[build]
  # --webpack: Turbopack-built middleware chunks aren't resolved correctly
  # by the Netlify Next.js plugin's edge-function bundler on Windows (hit a
  # "Cannot find module './chunks/[turbopack]_runtime.js'" failure during a
  # `netlify deploy --prod` run from Windows) — webpack output doesn't hit
  # this bug.
  command = "prisma generate && prisma migrate deploy && next build --webpack"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The site moved from roof-scout.org to roofscout.io. This rule is scoped to
# the old hostname, so it only fires for traffic still arriving at
# roof-scout.org — roofscout.io itself never matches "from" and is
# unaffected, which is what makes it safe to ship in the shared netlify.toml
# both sites deploy from.
[[redirects]]
  from = "https://roof-scout.org/*"
  to = "https://roofscout.io/:splat"
  status = 301
  force = true
